[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-ai-call-audit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography==48.0.0",
    "fastapi==0.136.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "PyJWT==2.14.0",
    "psycopg[binary]==3.3.6",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
transcription = ["faster-whisper==1.2.1"]
privacy = ["presidio-analyzer==2.2.364"]
browser-test = ["playwright==1.60.0"]

[tool.setuptools]
packages = ["app"]
