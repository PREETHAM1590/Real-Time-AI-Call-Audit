# Prometheus rule file for the call-audit /metrics exporter (app/metrics.py).
#
# Every `expr` below references only metric names that exporter emits:
# call_audit_database_up, call_audit_oldest_pending_job_age_seconds,
# call_audit_worker_stage_attempts_total, call_audit_jobs. No rule here depends
# on a metric this repository does not produce (see deploy/prometheus/README.md
# for what is intentionally NOT covered: redaction failures, STT failure rate,
# GPU/token/spend telemetry -- none of that is tracked yet).
#
# No Alertmanager receivers are configured anywhere in this repository, and
# nothing here sends a notification on its own; wiring receivers/routes is a
# separate, explicit operator decision. See the README in this directory.
groups:
  - name: call-audit-core
    rules:
      - alert: CallAuditDatabaseDown
        expr: call_audit_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Call-audit /metrics cannot reach PostgreSQL"
          description: >-
            The last scrape's database queries failed, so no other call-audit
            series is currently trustworthy. Matches the operations guide's
            "Processing unavailable" signal.

      # Matches docs/operations-and-evaluation.md's "Metrics and alerting" table:
      # "oldest eligible job >5 minutes for 5 minutes" -> page on-call.
      # "Eligible" = a worker is actually serving that stage. Workers only claim
      # stages they have a configured handler for, so jobs for an intentionally
      # unconfigured stage (e.g. ANALYSE before a disposition model is provisioned)
      # sit QUEUED forever; paging on max() over every stage would page
      # permanently in any partially configured deployment. Restrict to stages
      # with worker activity in the last hour; the rule below covers the rest.
      - alert: CallAuditOldestPendingJobTooOld
        expr: >-
          max by (stage) (call_audit_oldest_pending_job_age_seconds) > 300
          and on (stage)
          sum by (stage) (increase(call_audit_worker_stage_attempts_total[1h])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Call-audit stage {{ $labels.stage }} is falling behind"
          description: >-
            A stage that workers have served within the last hour has a pending
            job older than 300 seconds, sustained for 5 minutes. Inspect
            worker/dependency health and lease recovery.

      # Proposed default threshold, not a measured value: sustained retry/lease
      # churn at 20% of committed volume is treated here as worth paging on.
      # Re-tune once real traffic volume and false-positive rate are observed.
      - alert: CallAuditWorkerRetryRateHigh
        expr: >-
          (
            sum(rate(call_audit_worker_stage_attempts_total{outcome=~"RETRY_HANDLED|RETRY_HANDLER_FAILED|LEASE_LOST"}[15m]))
            /
            clamp_min(sum(rate(call_audit_worker_stage_attempts_total{outcome="COMMITTED"}[15m])), 1e-9)
          ) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Call-audit worker retry/lease-loss rate is high relative to committed work"
          description: >-
            Over the last 15 minutes, RETRY_HANDLED + RETRY_HANDLER_FAILED +
            LEASE_LOST attempts exceed 20% of COMMITTED attempts (proposed
            default threshold -- re-tune from measured data). Investigate the
            affected stage's local model/dependency before treating this as a
            model-quality signal.

      # A stage with old pending work that no worker has attempted in 30 minutes.
      # Workers never claim a stage they have no handler for, so unconfigured-stage
      # jobs stay QUEUED (not WAITING_HANDLER, which only the legacy unfiltered
      # claim path produces) -- detect "not being served" from the absence of
      # attempts instead. This cannot distinguish "intentionally parked, model not
      # provisioned yet" from "every worker serving this stage is down", so it is
      # a warning; raise it to critical once every stage you expect is configured.
      - alert: CallAuditStageNotBeingServed
        expr: >-
          max by (stage) (call_audit_oldest_pending_job_age_seconds) > 1800
          unless on (stage)
          sum by (stage) (increase(call_audit_worker_stage_attempts_total[30m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No worker is serving call-audit stage {{ $labels.stage }}"
          description: >-
            Stage {{ $labels.stage }} has a pending job older than 30 minutes and
            no worker attempts in the last 30 minutes: either no worker has a
            handler configured for it (intentionally parked or misconfigured), or
            all workers serving it are down.
