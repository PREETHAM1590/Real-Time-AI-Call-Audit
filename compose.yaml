services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: call_audit
      POSTGRES_USER: call_audit
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U call_audit -d call_audit"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
